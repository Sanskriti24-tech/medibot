<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediBot &mdash; Your Health Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="app">

  <header>
    <div class="logo">&#129658;</div>
    <div class="title">
      <h1>MediBot</h1>
      <p>Your friendly health assistant</p>
    </div>
    <div class="status"><span class="dot"></span> Online</div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="quick" id="quick">
    <span class="quick-label">Quick chat &mdash; tap a symptom</span>
    <button class="chip" data-msg="I have a fever">Fever</button>
    <button class="chip" data-msg="I have a headache">Headache</button>
    <button class="chip" data-msg="I have a cough and cold">Cough &amp; Cold</button>
    <button class="chip" data-msg="I have stomach pain">Stomach Ache</button>
    <button class="chip" data-msg="I have a sore throat">Sore Throat</button>
    <button class="chip" data-msg="Give me a health tip">Health Tip</button>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Describe how you feel..."
           autocomplete="off">
    <button class="send" id="sendBtn" aria-label="Send">&#10148;</button>
  </div>

  <p class="disclaimer">
    &#9888; MediBot is an educational mini-project. It does not give real
    medical diagnoses &mdash; always consult a qualified doctor.
  </p>

</div>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
